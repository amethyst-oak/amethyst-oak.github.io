<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amethyst-oak.github.io</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            color: #38bdf8;
        }

        p {
            margin-bottom: 30px;
            color: #94a3b8;
            font-size: 1rem;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .repo-btn {
            display: block;
            padding: 15px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .repo-btn:hover {
            background: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        .repo-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello there!</h1>
        <p>Wouldn't be so nice...</p>
        
        <div class="links-container">
            <!-- Замени '#' на свои реальные ссылки, а текст внутри кнопок — на названия проектов -->
            <a href="github.com/amethyst-oak/amethyst-oak.github.io" target="_blank" class="repo-btn">Root</a>
            <a href="sileo://source/https://amethyst-oak.github.io" target="_blank" class="repo-btn">Add Repo (Sileo)</a>
            <a href="github.com/amethyst-oak/swipe" target="_blank" class="repo-btn">"Swipe" Repo</a>
            <!-- <a href="#" target="_blank" class="repo-btn">Репозиторий 4</a> -->
            <!-- <a href="#" target="_blank" class="repo-btn">Репозиторий 5</a> -->
        </div>
    </div>

</body>
</html>
